# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a linux

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Flip via repo Actions variables after master-down CI failures:
  #   vars.MINIROS_MASTER_DEBUG=1  -> console log + verbose xmlrpc for miniroscore
  MINIROS_MASTER_DEBUG: ${{ vars.MINIROS_MASTER_DEBUG || '0' }}

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      # Debug+clang enables TSan (same idea as local CLion cmake-build-debug-clang* + MINIROS_SANITIZE_THREADS).
      matrix:
        os: [ubuntu-latest] # Probably should add macOS-latest
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgpgme-dev libssl-dev libgtest-dev gdb valgrind
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        # Mirror CLion Debug+Clang TSan profile; raise timeout for TSan slowdown.
        # TOOL=none + HANG_TIMEOUT dumps all-thread stacks on hang (see test/launch_test.sh).
        if [ "${{ matrix.build_type }}" = "Debug" ] && [ "${{ matrix.c_compiler }}" = "clang" ]; then
          echo "sanitize-threads=ON" >> "$GITHUB_OUTPUT"
          echo "test-timeout=300" >> "$GITHUB_OUTPUT"
          echo "hang-timeout=280" >> "$GITHUB_OUTPUT"
        else
          echo "sanitize-threads=OFF" >> "$GITHUB_OUTPUT"
          # timer_callbacks alone is ~40s; 100/90 left almost no slack when a wait loops.
          echo "test-timeout=200" >> "$GITHUB_OUTPUT"
          echo "hang-timeout=180" >> "$GITHUB_OUTPUT"
        fi
        echo "test-tool=none" >> "$GITHUB_OUTPUT"
        ulimit -c unlimited         # Enable core dumps to be captured (must be in same run block)
        mkdir -p cores
        cat /proc/sys/kernel/core_pattern
        echo "$PWD/cores/corefile-%e-%p-%t" | sudo tee /proc/sys/kernel/core_pattern

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DMINIROS_ROSBAG_USE_GPGME_ENCRYPTION=ON 
        -DMINIROS_ROSBAG_USE_OPENSSL_ENCRYPTION=ON 
        -DMINIROS_BUILD_EXAMPLES=ON 
        -DMINIROS_BUILD_TESTS=ON
        -DMINIROS_SANITIZE_THREADS=${{ steps.strings.outputs.sanitize-threads }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # Do not pass make --ignore-errors: that lets compile/link failures exit 0 and CI proceeds to tests with missing binaries.
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}  # Run only if something went wrong
      with:
          name: bin-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}
          path: |
            ${{ steps.strings.outputs.build-output-dir }}/bin/*
            ${{ steps.strings.outputs.build-output-dir }}/lib/*.so

    - name: Test-basic
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      env:
        ROS_MASTER_URI: "http://localhost:11311"
        ROSCONSOLE_FORMAT: "[${severity}][${nthread}][${time}]: ${message}"
        TOOL: ${{ steps.strings.outputs.test-tool }}
        HANG_TIMEOUT: ${{ steps.strings.outputs.hang-timeout }}
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:history_size=7"
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest --output-on-failure --test-dir test -V --timeout ${{ steps.strings.outputs.test-timeout }} -E advanced -C ${{ matrix.build_type }}

    # Still run when Test-basic fails: advanced is where shared miniroscore
    # death shows up, and we need master-logs/crash dumps in the artifact.
    - name: Test-advanced
      if: ${{ success() || failure() }}
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      env:
        ROS_MASTER_URI: "http://localhost:11311"
        ROSCONSOLE_FORMAT: "[${severity}][${nthread}][${time}]: ${message}"
        TOOL: ${{ steps.strings.outputs.test-tool }}
        HANG_TIMEOUT: ${{ steps.strings.outputs.hang-timeout }}
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:history_size=7"
        # Shared miniroscore for advanced suite. Tests call requireMasterOrExit() after init
        # (exit 90 → launch_test.sh dumps master stacks + rosout/crash/cores).
        # Console + crash dumps always go under MINIROS_MASTER_LOG_DIR (uploaded on failure).
        MINIROS_MASTER_DEBUG: ${{ env.MINIROS_MASTER_DEBUG }}
        MINIROS_MASTER_LOG_DIR: ${{ steps.strings.outputs.build-output-dir }}/master-logs
        ROS_LOG_DIR: ${{ steps.strings.outputs.build-output-dir }}/master-logs
      run: |
        mkdir -p "$MINIROS_MASTER_LOG_DIR"
        # Core pattern is relative to the process cwd (bin/); keep a copy path under build too.
        mkdir -p cores "${{ github.workspace }}/cores"
        ./bin/manage-master start
        ctest --output-on-failure --test-dir test -V --timeout ${{ steps.strings.outputs.test-timeout }} -R advanced -C ${{ matrix.build_type }}
        ls -alh .
        ls -alh "$MINIROS_MASTER_LOG_DIR" || true
        ls -alh cores "${{ github.workspace }}/cores" 2>/dev/null || true
        ./bin/manage-master stop

    # Echo crash stacks into the job log so investigation does not require the zip.
    - name: Dump-master-crash-logs
      if: ${{ failure() }}
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        set +e
        echo "======== MASTER CRASH / CONSOLE (job log excerpt) ========"
        for f in \
          bin/late-master-logs/miniroscore.crash \
          bin/late-master-logs/miniroscore.console.log \
          master-logs/miniroscore.crash \
          master-logs/miniroscore.console.log \
          master-logs/master-fail-*/miniroscore.crash \
          master-logs/master-fail-*/miniroscore.console.log \
          master-logs/master-fail-*/*.bt.txt
        do
          for path in $f; do
            [ -f "$path" ] || continue
            sz=$(wc -c <"$path" | tr -d ' ')
            echo "----- $path ($sz bytes) -----"
            if [ "$sz" = "0" ]; then
              echo "(empty)"
              continue
            fi
            case "$path" in
              *.crash|*.bt.txt)
                cat "$path"
                ;;
              *)
                if command -v rg >/dev/null 2>&1; then
                  if rg -n "fatalSignalHandler|ThreadSanitizer|AddressSanitizer|SUMMARY:|DEADLYSIGNAL|ABORTING|SIGSEGV|signal=" "$path"; then
                    :
                  else
                    echo "(no sanitizer/crash markers; last 120 lines)"
                    tail -n 120 "$path"
                  fi
                else
                  grep -nE 'fatalSignalHandler|ThreadSanitizer|AddressSanitizer|SUMMARY:|DEADLYSIGNAL|ABORTING|SIGSEGV|signal=' "$path" \
                    || { echo "(no sanitizer/crash markers; last 120 lines)"; tail -n 120 "$path"; }
                fi
                ;;
            esac
          done
        done
        echo "======== END MASTER CRASH / CONSOLE ========"
        ls -la bin/late-master-logs master-logs cores bin/cores 2>/dev/null || true

    - name: Test-memcheck
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      #if: ${{ failure() }}  # Run only if something went wrong
      if: false # Temporary disabled.
      env:
        ROS_MASTER_URI: http://localhost:11311
        ROSCONSOLE_FORMAT: "[${severity}][${nthread}][${time}]: ${message}"
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ./bin/manage-master start
        TOOL=valgrind ctest --output-on-failure --test-dir test -V --timeout 100 -C ${{env.BUILD_TYPE}}
        ./bin/manage-master stop
    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}  # Run only if something went wrong
      with:
          name: cores-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}
          path: |
            cores/
            ${{ github.workspace }}/cores/
            ${{ steps.strings.outputs.build-output-dir }}/cores/
            ${{ steps.strings.outputs.build-output-dir }}/bin/cores/
            ${{ steps.strings.outputs.build-output-dir }}/master-logs/
            ${{ steps.strings.outputs.build-output-dir }}/bin/late-master-logs/
            ${{ steps.strings.outputs.build-output-dir }}/bin/master-fail-*/
          if-no-files-found: ignore
