# Build MiniROS on Windows and run basic (non-advanced) CTest suite.
# Win32 tests are currently optional: remaining failures (launcher paths,
# some XML-RPC live cases, platform-specific expectations) are tracked separately.
name: CMake on Win32

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Resolve vcpkg root
      id: vcpkg
      shell: pwsh
      run: |
        $root = $env:VCPKG_INSTALLATION_ROOT
        if (-not $root) { $root = $env:VCPKG_ROOT }
        if (-not $root) { $root = "C:\vcpkg" }
        $toolchain = Join-Path $root "scripts\buildsystems\vcpkg.cmake"
        if (-not (Test-Path -LiteralPath $toolchain)) {
          throw "vcpkg toolchain not found at $toolchain (root=$root)"
        }
        # Forward slashes for CMake; avoid UTF-8 BOM from Out-File.
        $toolchainCmake = ($toolchain -replace '\\', '/')
        Add-Content -Path $env:GITHUB_OUTPUT -Value "root=$root" -Encoding utf8NoBOM
        Add-Content -Path $env:GITHUB_OUTPUT -Value "toolchain=$toolchainCmake" -Encoding utf8NoBOM
        Write-Host "Using vcpkg root: $root"
        Write-Host "Toolchain: $toolchainCmake"

    - name: Install GTest (vcpkg)
      shell: pwsh
      run: vcpkg install gtest:x64-windows

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B "${{ github.workspace }}/build" `
          "-DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.toolchain }}" `
          -DMINIROS_BUILD_EXAMPLES=ON `
          -DMINIROS_BUILD_TESTS=ON `
          -S "${{ github.workspace }}"

    - name: Build
      shell: pwsh
      run: cmake --build "${{ github.workspace }}/build" --config ${{ env.BUILD_TYPE }}

    - name: Test-basic (optional)
      id: test_basic
      continue-on-error: true
      working-directory: ${{ github.workspace }}/build
      env:
        ROSCONSOLE_FORMAT: "[${severity}][${nthread}][${time}]: ${message}"
      # Exclude advanced/* (needs master + Linux launch_test.sh). Same filter as Linux CI.
      shell: pwsh
      run: |
        $vcpkgBin = Join-Path "${{ steps.vcpkg.outputs.root }}" "installed\x64-windows\bin"
        $env:PATH = "${{ github.workspace }}\build\bin;$vcpkgBin;" + $env:PATH
        ctest --output-on-failure --test-dir test -V --timeout 100 -E advanced -C ${{ env.BUILD_TYPE }}

    - name: Note optional test status
      if: steps.test_basic.outcome == 'failure'
      shell: pwsh
      run: Write-Host "::warning::Win32 Test-basic failed (optional; does not fail the job)"

    - uses: actions/upload-artifact@v4
      if: ${{ failure() || steps.test_basic.outcome == 'failure' }}
      with:
        name: win32-bin
        path: |
          ${{ github.workspace }}/build/bin/**
          ${{ github.workspace }}/build/lib/**
        if-no-files-found: ignore
